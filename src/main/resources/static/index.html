<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>let$watch - Your Movie Library</title>
    <style>
        :root { --yellow: #ffcc00; --bg: #0a0a0a; --card-bg: #161616; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background-color: var(--bg); color: var(--text); overflow: hidden; }
        .sidebar { width: 220px; background-color: #000; padding: 20px; border-right: 1px solid #222; flex-shrink: 0; }
        .logo { color: var(--yellow); font-size: 28px; font-weight: bold; margin-bottom: 40px; cursor: pointer; letter-spacing: -1px; }
        .menu-item { padding: 12px; margin: 5px 0; cursor: pointer; border-radius: 8px; color: #888; transition: 0.3s; }
        .menu-item:hover, .menu-item.active { background: #222; color: var(--yellow); }
        .main { flex: 1; overflow-y: auto; padding: 30px; scroll-behavior: smooth; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 30px; position: sticky; top: 0; background: var(--bg); z-index: 10; padding: 10px 0; }
        input, select { background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 5px; outline: none; flex: 1; }
        .btn-yellow { background: var(--yellow); color: black; border: none; padding: 10px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--yellow); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 270px; object-fit: cover; }
        .card-info { padding: 12px; }
        .card-info h4 { margin: 4px 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .year-label { color: #888; font-size: 11px; }
        .rating-label { color: var(--yellow); font-size: 12px; font-weight: bold; }
        .delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: none; z-index: 10; font-weight: bold; }
        .card:hover .delete-btn { display: block; }
        #modalOverlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.96); z-index: 100; justify-content: center; align-items: center; }
        .modal { background: #141414; width: 95%; max-width: 900px; border-radius: 15px; display: flex; overflow: hidden; border: 1px solid #333; }
        .modal img { width: 350px; object-fit: cover; }
        .modal-content { padding: 45px; flex: 1; position: relative; max-height: 85vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 15px; right: 25px; font-size: 35px; cursor: pointer; color: #888; }
        .btn-action { background: var(--yellow); color: #000; border: none; padding: 14px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .rating-box { font-size: 20px; color: var(--yellow); border: 1px solid #333; padding: 15px; border-radius: 8px; display: inline-block; margin-top: 15px; background: #1a1a1a; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo" onclick="location.reload()">let$watch</div>
    <div id="menu-rec" class="menu-item active" onclick="switchTab('REC')">Home / Popular</div>
    <div id="menu-watchlist" class="menu-item" onclick="switchTab('WATCHLIST')">Watchlist</div>
    <div id="menu-watched" class="menu-item" onclick="switchTab('WATCHED')">Watched List</div>
</div>

<div class="main">
    <div class="filter-bar">
        <input type="text" id="searchField" placeholder="Discover movies..." onkeypress="if(event.key==='Enter') searchOMDb()">
        <select id="genreFilter" onchange="renderView()">
            <option value="All">All Genres</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Horror">Horror</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Thriller">Thriller</option>
            <option value="Animation">Animation</option>
        </select>
        <button class="btn-yellow" onclick="searchOMDb()">Search</button>
    </div>
    <h2 id="viewTitle">Popular Movies</h2>
    <div class="grid" id="movieGrid"></div>
</div>

<div id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">×</span>
        <img id="mImg" src="">
        <div class="modal-content">
            <h2 id="mTitle" style="margin-top: 0;"></h2>
            <p id="mMeta" style="color: var(--yellow); font-weight: bold; font-size: 18px;"></p>
            <p id="mPlot" style="color: #ccc; line-height: 1.8; margin: 25px 0;"></p>
            <div id="modalActions"></div>
        </div>
    </div>
</div>

<script>
    const API_KEY = '64ec61f1';
    const PROXY = 'https://images.weserv.nl/?url=';
    let currentTab = 'REC';
    let popularMovies = [];

    function getValidatedRating() {
        let validScores = ["1", "2", "3", "4", "5"];
        while (true) {
            let input = prompt("Rate (1, 2, 3, 4, or 5):");
            if (input === null) return null;
            if (validScores.includes(input.trim())) return parseInt(input);
            alert("Invalid input! Please enter only a single number from 1 to 5.");
        }
    }

    async function init() {
        const keywords = ["marvel", "horror", "action", "star", "2024", "sci-fi", "thriller"];
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = '<p style="color: var(--yellow)">let$watch is warming up...</p>';

        // PÁRHUZAMOS LEKÉRÉS (GYORSÍTÁS)
        const searchPromises = keywords.map(k => fetch(`https://www.omdbapi.com/?s=${k}&apikey=${API_KEY}`).then(r => r.json()));
        const results = await Promise.all(searchPromises);

        let combined = [];
        results.forEach(d => { if(d.Search) combined.push(...d.Search.slice(0, 8)); });
        combined = combined.filter((v,i,a)=>a.findIndex(t=>(t.imdbID === v.imdbID))===i);

        const detailPromises = combined.map(m => fetch(`https://www.omdbapi.com/?i=${m.imdbID}&apikey=${API_KEY}`).then(r => r.json()));
        popularMovies = await Promise.all(detailPromises);
        renderView();
    }

    async function searchOMDb() {
        const query = document.getElementById('searchField').value;
        if(!query) return;
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = '<p>Searching let$watch records...</p>';

        const p1 = fetch(`https://www.omdbapi.com/?s=${query}&page=1&apikey=${API_KEY}`).then(r => r.json());
        const p2 = fetch(`https://www.omdbapi.com/?s=${query}&page=2&apikey=${API_KEY}`).then(r => r.json());
        const [d1, d2] = await Promise.all([p1, p2]);

        let combined = [...(d1.Search || []), ...(d2.Search || [])];
        const detailPromises = combined.map(m => fetch(`https://www.omdbapi.com/?i=${m.imdbID}&apikey=${API_KEY}`).then(r => r.json()));
        const allResults = await Promise.all(detailPromises);

        document.getElementById('viewTitle').innerText = `Results for: ${query}`;
        renderCustomList(allResults);
    }

    function createCard(m, isExt) {
        const div = document.createElement('div');
        div.className = 'card';
        const title = isExt ? m.Title : m.title;
        const poster = isExt ? (m.Poster !== "N/A" ? PROXY + m.Poster : 'https://via.placeholder.com/300x450?text=No+Poster') : m.posterUrl;
        let rating = (!isExt && m.status === 'WATCHED') ? `<span class="rating-label">${"$".repeat(m.rating)}</span>` : "";
        let del = !isExt ? `<button class="delete-btn" onclick="event.stopPropagation(); removeMovie(${m.id})">×</button>` : "";
        div.innerHTML = `${del}<img src="${poster}"><div class="card-info"><div class="meta-row"><span class="year-label">${isExt ? m.Year : m.releaseYear}</span>${rating}</div><h4>${title}</h4></div>`;
        div.onclick = () => showModal(m, isExt);
        return div;
    }

    async function showModal(m, isExt) {
        const res = await fetch('/api/movies');
        const myMovies = await res.json();
        const movieTitle = isExt ? m.Title : m.title;
        const existing = myMovies.find(mm => mm.title.toLowerCase() === movieTitle.toLowerCase());
        document.getElementById('mTitle').innerText = movieTitle;
        document.getElementById('mImg').src = isExt ? (m.Poster !== "N/A" ? PROXY + m.Poster : 'https://via.placeholder.com/300x450') : m.posterUrl;
        document.getElementById('mMeta').innerText = `${isExt ? m.Year : m.releaseYear} • ${isExt ? m.Genre : m.genre}`;
        document.getElementById('mPlot').innerText = isExt ? m.Plot : m.plot;
        const actions = document.getElementById('modalActions');
        actions.innerHTML = '';
        if (existing) {
            if (existing.status === 'WATCHLIST') {
                actions.innerHTML = `<button class="btn-action" onclick="markWatched(${existing.id})">Mark as Watched</button>`;
            } else {
                actions.innerHTML = `<div class="rating-box">My Score: ${"$".repeat(existing.rating)}</div>`;
            }
        } else if (isExt) {
            actions.innerHTML = `<button class="btn-action" onclick="saveMovie('${m.imdbID}', 'WATCHLIST')">Add to Watchlist</button>
                                 <button class="btn-action" style="background:#222; color:var(--yellow); border:1px solid var(--yellow)" onclick="saveMovie('${m.imdbID}', 'WATCHED')">Add to Watched List</button>`;
        }
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    async function saveMovie(id, status) {
        const res = await fetch(`https://www.omdbapi.com/?i=${id}&apikey=${API_KEY}`);
        const data = await res.json();
        let rating = (status === 'WATCHED') ? getValidatedRating() : 0;
        if (status === 'WATCHED' && rating === null) return;
        const movie = { title: data.Title, releaseYear: parseInt(data.Year), genre: data.Genre, plot: data.Plot, posterUrl: PROXY + data.Poster, status: status, rating: rating };
        await fetch('/api/movies', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(movie) });
        closeModal(); renderView();
    }

    async function markWatched(id) {
        const score = getValidatedRating();
        if (score === null) return;
        const res = await fetch('/api/movies');
        const movies = await res.json();
        const movie = movies.find(m => m.id === id);
        movie.status = 'WATCHED'; movie.rating = score;
        await fetch('/api/movies', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(movie) });
        closeModal(); renderView();
    }

    async function renderView() {
        const grid = document.getElementById('movieGrid');
        const genre = document.getElementById('genreFilter').value;
        grid.innerHTML = '';
        if(currentTab === 'REC') {
            popularMovies.filter(m => genre === 'All' || m.Genre.includes(genre)).forEach(m => grid.appendChild(createCard(m, true)));
        } else {
            const movies = await (await fetch('/api/movies')).json();
            movies.filter(m => m.status === currentTab && (genre === 'All' || m.genre.includes(genre))).forEach(m => grid.appendChild(createCard(m, false)));
        }
    }

    function renderCustomList(list) {
        const grid = document.getElementById('movieGrid');
        const genre = document.getElementById('genreFilter').value;
        grid.innerHTML = '';
        list.filter(m => genre === 'All' || m.Genre.includes(genre)).forEach(m => grid.appendChild(createCard(m, true)));
    }

    async function removeMovie(id) {
        if(confirm("Delete from let$watch?")) { await fetch(`/api/movies/${id}`, { method: 'DELETE' }); renderView(); }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
        document.getElementById('menu-' + tab.toLowerCase().replace(' ', '')).classList.add('active');
        document.getElementById('viewTitle').innerText = tab === 'REC' ? "Popular Movies" : (tab === 'WATCHLIST' ? "Watchlist" : "Watched List");
        renderView();
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    init();
</script>
</body>
</html>
